<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12304A"/>
      <stop offset="1" stop-color="#071420"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="0.55" stop-color="#7BD98F"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Roof -->
  <path d="M92 246 L256 118 L420 246"
        fill="none" stroke="#EDF4F9" stroke-width="32"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Walls and floor -->
  <path d="M138 240 L138 402 L374 402 L374 240"
        fill="none" stroke="#EDF4F9" stroke-width="32"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Airflow inside: cool entering, warm leaving -->
  <path d="M182 300 C 220 272, 258 272, 296 300 C 316 314, 336 314, 344 302"
        fill="none" stroke="url(#flow)" stroke-width="24" stroke-linecap="round"/>
  <path d="M168 352 C 206 324, 244 324, 282 352 C 302 366, 322 366, 330 354"
        fill="none" stroke="url(#flow)" stroke-width="24" stroke-linecap="round"
        opacity="0.6"/>
</svg>
